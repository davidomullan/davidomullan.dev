# Favorite quotes, rendered on /quotes.
#
# lead:   the quote itself (shown large when featured)
# more:   optional continuation; line breaks are preserved
# author: who said it
# source: optional work, speech, or descriptor shown after the author
# note:   optional background, shown behind a "Context" toggle

- lead: |-
    The point is not to try harder, it’s to resist less.
  author: Terry Ritchie / Anne Lamott

- lead: |-
    Let your smile change the world, but don’t let the world change your smile.
  author: Bob Marley

- lead: |-
    PR days are possible because of the days when you feel like crap and still push yourself to be better. You don’t need to PR every day.
  author: Arnold Schwarzenegger

- lead: |-
