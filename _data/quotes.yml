- lead: |-
    We are not now that strength which in old days
    Moved earth and heaven, that which we are, we are;
    One equal temper of heroic hearts,
    Made weak by time and fate, but strong in will
    To strive, to seek, to find, and not to yield.
  author: Alfred, Lord Tennyson
  source: Ulysses

- lead: |-
    Standing up means voluntarily accepting the burden of being.
  more: |-
    Your nervous system responds in an entirely different manner when you face the demands of life voluntarily. To stand up straight with shoulders back is to accept the terrible responsibility of life with eyes wide open.
  author: Jordan Peterson

- lead: |-
    I am the master of my fate: I am the captain of my soul.
  more: |-
    Out of the night that covers me,
    Black as the pit from pole to pole,
    I thank whatever gods may be
    For my unconquerable soul.

    In the fell clutch of circumstance
    I have not winced nor cried aloud.
    Under the bludgeonings of chance
    My head is bloody, but unbowed.

    Beyond this place of wrath and tears
    Looms but the Horror of the shade,
    And yet the menace of the years
    Finds and shall find me unafraid.

    It matters not how strait the gate,
    How charged with punishments the scroll,
    I am the master of my fate,
    I am the captain of my soul.
  author: William Ernest Henley
  source: Invictus

- lead: |-
    Yesterday is history, tomorrow is a mystery, but today is a gift. That is why they call it the present.
  author: Master Oogway
  source: Kung Fu Panda

- lead: |-
    One often meets his destiny on the road he takes to avoid it.
  author: Master Oogway
  source: Kung Fu Panda

- lead: |-
    Life happens wherever you are, whether you make it or not.
  author: General Iroh
  source: "Avatar: The Last Airbender"
  note: |-
    In response to Zuko saying, “I don’t want to make a life here.”

- lead: |-
    If you live each day as if it was your last, someday you’ll most certainly be right.
  author: Steve Jobs
  source: 2005 Stanford Commencement Address

- lead: |-
    It isn’t legendary unless your friends are there to see it.
  author: Barney Stinson
  source: How I Met Your Mother

- lead: |-
    Whether you think you can or think you can’t, you’re right.
  author: Henry Ford

- lead: |-
    Any wall, door, or obstacle you face you will overcome. You can go over it, under it, around it, or you will destructively go through it, but you will get to the other side.
  author: Jason Redman

- lead: |-
    Leadership is not a rank. Leadership is not a position. Leadership is a choice.
  author: Simon Sinek

- lead: |-
    You’ve got to find what you love. And that is as true for your work as it is for your lovers. Your work is going to fill a large part of your life, and the only way to be truly satisfied is to do what you believe is great work. And the only way to do great work is to love what you do. If you haven’t found it yet, keep looking. Don’t settle. As with all matters of the heart, you’ll know when you find it.
  author: Steve Jobs
  source: 2005 Stanford Commencement Address

- lead: |-
    The final test of leadership is the ability of a leader to instill the will to lead in those he’s left behind.
  author: Walter Lippmann

- lead: |-
    It’s a great day to be alive.
  author: Ian Humphrey
  note: |-
    Ian’s grandma used to tell him every day that it’s a great day to be alive, but for a long time he didn’t believe it. He had a rough childhood and went down the wrong path, to prison. A janitor there told him, “Prison doesn’t have to be your life. You can turn your life around and do great things. I believe in you.” Ian cried in his cell; it was the first time anyone had told him that. He turned his life around and has only been back to prison to mentor and teach. Now he takes every opportunity to tell anyone who will listen that it’s a great day to be alive.

- lead: |-
    The cost of leadership is self-interest.
  author: Simon Sinek

- lead: |-
    Good.
  more: |-
    Didn’t get that new high-speed gear? Good.
    Didn’t get that promotion? Good. More time to learn.
    Didn’t get picked for that mission? Good. We can focus on this other one we’ve got.
    Got beat? Good. You learned.
  author: Jocko Willink
  source: Former Navy SEAL
  note: |-
    Every time one of his guys came to him with bad news, Jocko would respond with “Good.” Finally one of them said, “I already know what you’re going to say. You’re going to say good.” Jocko replied, “Well, yeah. When things go wrong, there is going to be some good that comes from it.”

- lead: |-
    Sharing tea with a fascinating stranger is one of life’s true delights.
  author: General Iroh
  source: "Avatar: The Last Airbender"
