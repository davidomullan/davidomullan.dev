    Pain is not my enemy; it is my call to greatness.
  author: Henry Rollins
  source: Iron and the Soul

- lead: |-
    Strength reveals itself through character.
    When the body is strong, the mind thinks strong thoughts.
  more: |-
    I have never met a truly strong person who didn’t have self-respect.
  author: Henry Rollins
  source: Iron and the Soul

- lead: |-
    The Iron is the great reference point, the all-knowing perspective giver.
  more: |-
    Friends may come and go. But two hundred pounds is always two hundred pounds.
  author: Henry Rollins
  source: Iron and the Soul

- lead: |-
    We are what we repeatedly do.
  more: |-
    Excellence, then, is not an act but a habit.
  author: Will Durant / Aristotle

- lead: |-
    Inspiration is for amateurs, the rest of us get to work.
  author: Jimmy Carr

- lead: |-
    Whatever you can do, or dream you can, begin it! Boldness has genius, power and magic in it.
  author: Goethe

- lead: |-
    Things don’t come along in an orderly fashion, and they never will.
  author: Warren Buffett

- lead: |-
    When the tide goes out you discover who’s been swimming naked.
  author: Warren Buffett

- lead: |-
    8 Missions to Develop Self-Confidence
  more: |-
    1. Have a positive attitude
    2. PT and be healthy (PT your brain more than anything)
    3. Motivate yourself (and motivate others)
    4. Earn respect (respect is earned, not deserved)
    5. Set goals (have a definitive direction)
    6. Live with integrity
    7. Find a mentor (and mentor others)
    8. Have fun (find a reason to laugh every day)
  author: David Rutherford
  source: Former Navy SEAL, Froglogic

- lead: |-
    You must never give in to despair. Allow yourself to slip down that road and you surrender to your lowest instincts. In the darkest times, hope is something you give yourself. That is the meaning of inner strength.
  author: General Iroh
  source: "Avatar: The Last Airbender"

- lead: |-
    Don’t, however, worry about your individual potential.
  more: |-
    Potential is only the expression of a possibility;
    something that can be accessed accurately only in retrospect.
    In other words, you’ll never know how good you might have become unless you try.
  author: Mike Mentzer

- lead: |-
    If the highest aim of a captain…
  more: |-
    was to preserve his ship, he would keep it in port forever.
  author: Thomas Aquinas

- lead: |-
    Keep away from people who want to belittle your ambitions. Small people always do that, but the really great make you feel that you, too, can be great.
  author: Mark Twain

- lead: |-
    Pride is not the opposite of shame, but its source.
  author: General Iroh
